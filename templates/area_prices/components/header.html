<div class="flex items-center justify-between">
  <div class="space-y-6">
    <div>
      <h1 class="font-bold text-2xl">
        Area Prices
      </h1>

      <p class="text-gray-400">
        Add Edit Delete Area Price
      </p>

    </div>

    <div class="flex items-center space-x-6">

      <input
        type="text"
        name="search"
        placeholder="Search Area Price..."
        autocomplete="off"

        class="w-128 rounded-lg border border-gray-300 px-4 py-2 text-sm
              outline-none
              focus:border-blue-500
              focus:ring-2
              focus:ring-blue-200"

        hx-get="{% url 'area_price_search' %}"
        hx-trigger="keyup changed delay:300ms"
        hx-target="#area-price-results"
        hx-swap="innerHTML"
      >

    </div>
  </div>

  <a href="{% url 'area_price_new' %}" class="rounded bg-blue-600 px-4 py-2 text-center text-white font-bold hover:bg-blue-700">
    + New Area Price
  </a>
</div>
