<header class="sticky top-0 z-50 border-b border-gray-200 bg-white shadow-sm">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6">

    <a href="{% url 'dashboard' %}" class="text-xl font-bold text-black hover:scale-105">
      KFC's Marketing & Sales
    </a>

    <nav class="flex items-center gap-4">

      <a href="{% url 'dashboard' %}"
        class="py-2 px-3 overflow-hidden rounded-lg border border-red-100 bg-white p-6 shadow-sm transition-all duration-300 hover:scale-105 active:scale-110 hover:border-red-500 hover:bg-gradient-to-br hover:from-red-50 hover:shadow-xl hover:shadow-red-500/20">
        Home
      </a>

      {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit"
          class="hover:scale-105 py-2 px-3 overflow-hidden rounded-lg border border-red-100 bg-white p-6 shadow-sm transition-all duration-300 hover:scale-105 active:scale-110 hover:border-red-500 hover:bg-gradient-to-br hover:from-red-50 hover:shadow-xl hover:shadow-red-500/20">
          Logout
        </button>
      </form>
      {% endif %}

    </nav>

  </div>
</header>
