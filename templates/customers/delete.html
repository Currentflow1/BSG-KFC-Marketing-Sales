{% extends "base.html" %}

{% block content %}

<h2 class="text-xl font-bold mb-4">
  Delete Customer
</h2>

<p>
  Are you sure you want to delete
  <strong>{{ customer.customer_business_name }}</strong>?
</p>

<form method="post">
  {% csrf_token %}

  <button type="submit" class="rounded bg-red-600 px-4 py-2 text-white">
    Yes, Delete
  </button>

  <a href="{% url 'customer_list' %}" class="rounded border px-4 py-2">
    Cancel
  </a>
</form>

{% endblock %}
