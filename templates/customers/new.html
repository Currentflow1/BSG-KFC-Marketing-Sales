{% extends "base.html" %}

{% block content %}

<div class="flex justify-between items-center mb-4 mt-2">
  <h1 class="text-2xl font-bold">
    Add Customer
  </h1>

  <a href="{% url 'customer_list' %}" class="p-2 rounded font-bold text-white bg-blue-600 hover:bg-blue-700">
    &larr; Back to Customer
  </a>
</div>

<form method="post">
  {% csrf_token %}

  {% include "customers/components/form.html" %}

  <div class="mt-6">
    <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-white">
      Save Customer
    </button>

    <a href="{% url 'customer_list' %}" class="ml-2 rounded-lg border px-4 py-2">
      Cancel
    </a>
  </div>
</form>

{% endblock %}
