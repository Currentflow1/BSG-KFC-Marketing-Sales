<a href="{{ href }}">
  <div
    class="group relative h-full overflow-hidden rounded-2xl border border-red-100 bg-white p-6 shadow-sm transition-all duration-300 hover:scale-105 active:scale-110 hover:border-red-500 hover:bg-gradient-to-br hover:from-red-50 hover:shadow-xl hover:shadow-red-500/20">

    <div
      class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/40 to-transparent transition-transform duration-700 group-hover:translate-x-full">
    </div>

    <div class="relative mb-4 flex items-center gap-4">

      <div
        class="flex h-12 w-12 items-center justify-center rounded-xl bg-red-100 text-2xl transition-all duration-300 group-hover:scale-110 group-hover:bg-yellow-200">
        {{ emoji }}
      </div>

      <h3 class="text-lg font-semibold text-gray-900 transition-colors duration-300 group-hover:text-red-600">
        {{ title }}
      </h3>

    </div>

    <p class="relative text-sm leading-6 text-gray-600">
      {{ description }}
    </p>

  </div>
</a>
