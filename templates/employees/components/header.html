<div class="flex items-center justify-between">
  <div class="space-y-6">
    <div>
      <h1 class="font-bold text-2xl">
        Employee Page
      </h1>

      <p class="text-gray-400">
        Add Edit Delete Employee
      </p>

    </div>
      <div class="flex items-center space-x-6">

        <input
            type="text"
            name="search"
            value="{{ request.GET.search }}"
            placeholder="Search Employees..."
            class="w-128 rounded-lg border border-gray-300 px-4 py-2 text-sm
                  outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"

            hx-get="{% url 'employee_search' %}"
            hx-trigger="keyup changed delay:300ms"
            hx-target="#employee-results"
            hx-swap="innerHTML"
        >

      </div>
  </div>

  <a href="{% url 'employee_new' %}" class="rounded bg-blue-600 px-4 py-2 text-center text-white font-bold hover:bg-blue-700">
    + New Employee
  </a>
</div>
