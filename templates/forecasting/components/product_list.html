<div class="overflow-x-auto">

  <table class="min-w-full rounded-lg border border-gray-200">

    <thead class="bg-gray-100">

      <tr>

        <th class="px-4 py-2 text-left">
          Product Code
        </th>

        <th class="px-4 py-2 text-left">
          Product Name
        </th>

        <th class="px-4 py-2 text-center">
          Status
        </th>

        <th class="px-4 py-2 text-center">
          Action
        </th>

      </tr>

    </thead>

    <tbody>

      {% for product in products %}

      <tr class="border-t hover:bg-gray-50">

        <td class="px-4 py-2">
          {{ product.product_code }}
        </td>

        <td class="px-4 py-2">
          {{ product.product_name }}
        </td>

        <td class="px-4 py-2 text-center">

          {% if product.discontinued %}

          <span class="rounded bg-red-100 px-2 py-1 text-sm text-red-700">
            Discontinued
          </span>

          {% else %}

          <span class="rounded bg-green-100 px-2 py-1 text-sm text-green-700">
            Active
          </span>

          {% endif %}

        </td>

        <td class="px-4 py-2">

          <div class="flex justify-center">

            <a
              href="{% url 'product_forecast' product.product_id %}"
              class="rounded bg-blue-600 px-3 py-1 text-white hover:bg-blue-700"
            >
              Forecast
            </a>

          </div>

        </td>

      </tr>

      {% empty %}

      <tr>

        <td colspan="4" class="py-8 text-center text-gray-500">
          No products found.
        </td>

      </tr>

      {% endfor %}

    </tbody>

  </table>

</div>
