<div class="rounded-lg border border-gray-200 bg-white p-5">

  <h2 class="mb-4 text-lg font-semibold">
    Forecast Settings
  </h2>

  <form method="get" class="space-y-4">

    <div>

      <label class="mb-2 block font-medium">
        Forecast Horizon
      </label>

      <select name="days" class="w-full rounded-lg border border-gray-300 px-4 py-2">
        <option value="7" {% if horizon == 7 %}selected{% endif %}>
          7 Days
        </option>

        <option value="30" {% if horizon == 30 %}selected{% endif %}>
          30 Days
        </option>

        <option value="60" {% if horizon == 60 %}selected{% endif %}>
          60 Days
        </option>

        <option value="90" {% if horizon == 90 %}selected{% endif %}>
          90 Days
        </option>
      </select>

    </div>

    <div class="flex gap-2">

      <button class="rounded-lg bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">
        Generate
      </button>

      <a href="?days={{ horizon }}&refresh=1" class="rounded-lg border border-gray-300 px-4 py-2 hover:bg-gray-50">
        Refresh
      </a>

    </div>

  </form>

</div>
