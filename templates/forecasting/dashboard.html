{% extends "base.html" %}

{% block content %}

<div class="space-y-8">

  <div class="space-y-6">

    <div>
      <h1 class="text-2xl font-bold">
        Demand Forecasting
      </h1>

      <p class="text-gray-400">
        Forecast future product demand using historical order data.
      </p>
    </div>

    <div class="flex items-center gap-3">

      <input
        type="text"
        name="search"
        value="{{ request.GET.search }}"
        placeholder="Search Forecast..."
        class="w-128 rounded-lg border border-gray-300 px-4 py-2
               focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"

        hx-get="{% url 'forecasting_search' %}"
        hx-trigger="keyup changed delay:300ms"
        hx-target="#forecast-results"
        hx-swap="innerHTML"
      >

    </div>

  </div>


  <div id="forecast-results">

    {% include "forecasting/components/product_list.html" %}

  </div>

</div>

{% endblock %}
