{% load humanize %}
<tr id="delivery-line-{{ line.id }}" class="border-t hover:bg-gray-50">
  <td class="px-4 py-2">{{ line.order_type }}</td>
  <td class="px-4 py-2">{{ line.product }}</td>

  <td class="px-4 py-2">
    {% if editing %}
      <form class="inline-flex flex-col"
            hx-post="{% url 'delivery_quantity_update' order.id line.id %}"
            hx-target="#delivery-line-{{ line.id }}"
            hx-swap="outerHTML">
        {% csrf_token %}
        <input type="text"
               name="quantity"
               value="{{ value|default:line.quantity }}"
               inputmode="numeric"
               autocomplete="off"
               autofocus
               onfocus="this.select()"
               class="w-24 rounded border border-blue-400 px-2 py-1 focus:outline-none focus:ring-2 focus:ring-blue-300"
               hx-get="{% url 'delivery_line_row' order.id line.id %}"
               hx-trigger="keyup[key=='Escape']"
               hx-target="#delivery-line-{{ line.id }}"
               hx-swap="outerHTML">
        {% if error %}
          <span class="mt-1 text-xs text-red-600">{{ error }}</span>
        {% endif %}
      </form>
    {% else %}
      <span class="cursor-pointer rounded px-2 py-1 hover:bg-gray-200"
            title="Click to edit"
            hx-get="{% url 'delivery_line_row' order.id line.id %}?edit=1"
            hx-target="#delivery-line-{{ line.id }}"
            hx-swap="outerHTML">
        {{ line.quantity|intcomma }}
      </span>
    {% endif %}
  </td>

  <td class="px-4 py-2">₱{{ line.line_price|floatformat:2|intcomma }}</td>

  <td class="px-4 py-2 text-center">
    <form method="post" action="{% url 'delivery_delete' order.id line.id %}">
      {% csrf_token %}
      <button type="submit" onclick="return confirm('Remove this line?')"
        class="cursor-pointer rounded bg-red-500 px-3 py-1 text-white hover:bg-red-600">
        Remove
      </button>
    </form>
  </td>
</tr>
