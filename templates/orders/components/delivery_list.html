<div class="rounded-lg border border-gray-200 bg-white p-6 lg:col-span-2">
  <h2 class="mb-3 font-medium">
    Delivery Lines
  </h2>
  <div class="max-h-[450px] overflow-y-auto overflow-x-auto">
    <table class="min-w-full rounded-lg border border-gray-200">
      <thead class="sticky top-0 z-10 bg-gray-100">
        <tr>
          <th class="px-4 py-2 text-left">Order Type</th>
          <th class="px-4 py-2 text-left">Product</th>
          <th class="px-4 py-2 text-left">Quantity</th>
          <th class="px-4 py-2 text-left">Line Price</th>
          <th class="px-4 py-2 text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for line in lines %}
        <tr class="border-t hover:bg-gray-50">
          <td class="px-4 py-2">
            {{ line.order_type }}
          </td>
          <td class="px-4 py-2">
            {{ line.product }}
          </td>
          <td class="px-4 py-2">
            {{ line.quantity }}
          </td>
          <td class="px-4 py-2">
            ₱{{ line.line_price }}
          </td>
          <td class="px-4 py-2 text-center">
            <form method="post" action="{% url 'delivery_delete' order.id line.id %}">
              {% csrf_token %}
              <button type="submit" onclick="return confirm('Remove this line?')"
                class="cursor-pointer rounded bg-red-500 px-3 py-1 text-white hover:bg-red-600">
                Remove
              </button>
            </form>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="5" class="px-4 py-6 text-center text-gray-500">
            No delivery lines yet.
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
