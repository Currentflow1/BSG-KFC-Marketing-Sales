<div class="rounded-lg border border-gray-200 bg-white p-6">
  <div class="mb-5 flex items-center justify-between">
    <h2 class="text-xl font-semibold">
      Order Information
    </h2>
  </div>
  <table class="w-full">
    <tbody>
      <tr class="border-b">
        <td class="py-3 text-lg font-medium">
          Agent
        </td>
        <td class="py-3 text-right text-lg">
          {{ order.agent }}
        </td>
      </tr>
      <tr class="border-b">
        <td class="py-3 text-lg font-medium">
          Area
        </td>
        <td class="py-3 text-right text-lg">
          {{ order.area }}
        </td>
      </tr>
 
      <!-- both date fields now live inside this form -->
      <form id="order-dates-form">
        <tr class="border-b">
          <td class="py-3 text-lg font-medium">
            MLOAD
          </td>
          <td class="py-3 text-right text-lg">
            <input type="date" name="mload_date"
              value="{{ order.mload_date|date:'Y-m-d' }}"
              class="rounded-lg border border-gray-300 px-3 py-1 text-right"
              hx-post="{% url 'save_order_dates' order.id %}"
              hx-trigger="change"
              hx-include="#order-dates-form"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-swap="none">
          </td>
        </tr>
        <tr class="border-b">
          <td class="py-3 text-lg font-medium">
            MRET
          </td>
          <td class="py-3 text-right text-lg">
            <input type="date" name="mret_date"
              value="{{ order.mret_date|date:'Y-m-d' }}"
              class="rounded-lg border border-gray-300 px-3 py-1 text-right"
              hx-post="{% url 'save_order_dates' order.id %}"
              hx-trigger="change"
              hx-include="#order-dates-form"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-swap="none">
          </td>
        </tr>
      </form>
 
      <tr class="border-b">
        <td class="py-3 text-lg font-medium">
          SO
        </td>
        <td class="py-3 text-right text-lg">
          {{ order.mret_date|date:'Y-m-d' }}
        </td>
      </tr>
    </tbody>
  </table>
  <div class="mt-6">
    <a href="{% url 'order_edit' order.id %}"
      class="block w-full rounded-lg bg-yellow-500 px-5 py-3 text-center text-base font-medium text-white hover:bg-yellow-600">
      Edit Order
    </a>
  </div>
 
  <div class="mt-3 grid grid-cols-3 gap-3">
    <form method="post" action="{% url 'manage_delivery_mload' order.id %}" id="delivery-mload-form">
      {% csrf_token %}
      <button type="submit" id="delivery-mload-btn"
        class="block w-full rounded-lg border border-gray-300 px-5 py-3 text-center text-base font-medium hover:bg-gray-100">
        Marketing LOAD
      </button>
    </form>
    <form method="post" action="{% url 'manage_delivery_mret' order.id %}" id="delivery-mret-form">
      {% csrf_token %}
      <button type="submit" id="delivery-mret-btn"
        class="block w-full rounded-lg border border-gray-300 px-5 py-3 text-center text-base font-medium hover:bg-gray-100">
        Marketing RET
      </button>
    </form>
    <form method="post" action="{% url 'manage_delivery_vbo' order.id %}" id="delivery-vbo-form">
      {% csrf_token %}
      <button type="submit" id="delivery-vbo-btn"
        class="block w-full rounded-lg border border-gray-300 px-5 py-3 text-center text-base font-medium hover:bg-gray-100">
        Van BO
      </button>
    </form>
  </div>
</div>
