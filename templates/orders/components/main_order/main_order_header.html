<div class="flex items-center justify-between">

  <div class="space-y-6">

    <div>
      <h1 class="font-bold text-2xl">
        Orders
      </h1>

      <p class="text-gray-400">
        Add Edit Delete Orders
      </p>
    </div>

    <div class="flex items-center space-x-6">

      <input type="text" name="search" value="{{ request.GET.search }}" placeholder="Search Orders..."
        autocomplete="off" class="w-lg rounded-lg border border-gray-300 px-4 py-2 text-sm
              focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none" hx-get="{% url 'order_search' %}"
        hx-trigger="keyup changed delay:300ms" hx-target="#orders-results" hx-swap="innerHTML">

    </div>

  </div>

  <a href="{% url 'order_add' %}" class="rounded bg-blue-600 px-4 py-2 text-center text-white hover:bg-blue-700">
    + New Order
  </a>

</div>
