{% if messages %}
<div class="mb-4 space-y-2">
  {% for message in messages %}
  <div class="rounded px-4 py-2 text-sm
        {% if message.tags == 'error' %}
            bg-red-100 text-red-700
        {% else %}
            bg-green-100 text-green-700
        {% endif %}">
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}
