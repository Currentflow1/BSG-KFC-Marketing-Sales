<div class="rounded-lg border border-gray-200 bg-white p-6">
  <h2 class="mb-3 font-medium">Customers &amp; Invoices</h2>

  <div class="mb-4 space-y-2">
    {% for cd in order.customers.all %}
      <div class="flex justify-between border-b pb-2 text-sm">
        <span>{{ cd.customer }}</span>
        <span class="text-gray-500">INV {{ cd.invoice_no }}</span>
      </div>
    {% empty %}
      <p class="text-sm text-gray-400">No customers added yet.</p>
    {% endfor %}
  </div>

  <form method="post" action="{% url 'add_customer' order.id %}" class="space-y-2">
    {% csrf_token %}
    {{ customer_form.customer }}
    {{ customer_form.invoice_no }}
    <button type="submit" class="w-full cursor-pointer rounded-lg bg-blue-600 hover:bg-blue-700 px-4 py-2 text-white">
      + Add Customer
    </button>
  </form>
</div>
