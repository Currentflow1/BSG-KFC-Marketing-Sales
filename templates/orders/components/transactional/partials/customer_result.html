{% if customer_detail %}

<div class="font-medium text-green-800">
  Invoice {{ customer_detail.invoice_no }}
</div>

<div class="text-green-700">
  {{ customer_detail.customer }}
</div>

<input
  type="hidden"
  name="customer_detail"
  value="{{ customer_detail.id }}"
>

{% elif query %}

<div class="text-sm text-red-600">
  Invoice not found.
</div>

{% endif %}
