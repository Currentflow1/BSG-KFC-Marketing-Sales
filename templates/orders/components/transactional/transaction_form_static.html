<div class="rounded-lg border border-gray-200 bg-white p-4 lg:col-span-1 mb-4">

  <h2 class="mb-2 text-base font-medium">
    Order Info
  </h2>

  <div class="flex flex-row gap-4">

    <!-- INVOICE (read-only, set by selecting a row on order_customers.html) -->
    <div class="flex-1">
      <label class="mb-1 block text-sm font-medium">
        Invoice
      </label>

      <div id="customer-result">
        {% if selected_customer_detail %}
          <div class="rounded-lg border border-gray-300 bg-gray-50 px-4 py-2">
            <div class="font-medium text-gray-900">
              Invoice {{ selected_customer_detail.invoice_no }}
            </div>
            <div class="text-sm text-gray-600">
              {{ selected_customer_detail.customer }}
            </div>
          </div>
          <input
            type="hidden"
            name="customer_detail_value"
            value="{{ selected_customer_detail.id }}"
          >
        {% else %}
          <div class="rounded-lg border border-dashed border-gray-300 px-4 py-2 text-sm text-gray-500">
            No invoice selected. Go back and choose one from the customer list.
          </div>
          <input type="hidden" name="customer_detail_value" value="">
        {% endif %}
      </div>

      {{ form.customer_detail.errors }}
    </div>

    <!-- INVOICE TYPE -->
    <div class="flex-1">
      <label for="{{ form.invoice_type.id_for_label }}" class="mb-1 block text-sm font-medium">
        Invoice Type
      </label>
      <select
        id="{{ form.invoice_type.id_for_label }}"
        class="w-full rounded-lg border border-gray-300 px-4 py-2"
        hx-post="{% url 'set_transaction_context' order.id %}"
        hx-trigger="change"
        hx-swap="none"
      >
        {% for value, label in form.invoice_type.field.choices %}
        <option value="{{ value }}" {% if value == form.invoice_type.value|stringformat:"s" %}selected{% endif %}>
          {{ label }}
        </option>
        {% endfor %}
      </select>
      {{ form.invoice_type.errors }}
    </div>

    <div>
      <label
          for="invoice_balance"
          class="block text-sm font-semibold text-gray-700 mb-1"
      >
          Invoice Balance
      </label>

      <input
        type="number"
        name="invoice_balance"
        id="invoice_balance"
        step="1"
        min="0"
        value="{{ selected_customer_detail.invoice_balance|default_if_none:'' }}"
        placeholder="0"
        class="w-full border border-gray-300 rounded px-3 py-2"
        hx-post="{% url 'save_invoice_balance' order.id %}"
        hx-trigger="change, blur"
        hx-swap="none"
    >
    </div>
  </div>
</div>
