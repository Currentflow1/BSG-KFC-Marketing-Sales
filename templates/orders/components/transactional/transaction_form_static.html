<!-- ORDER INFO — invoice lookup, order type, invoice type. Persists independently. -->
<div class="rounded-lg border border-gray-200 bg-white p-4 lg:col-span-1 mb-4">

  <h2 class="mb-2 text-base font-medium">
    Order Info
  </h2>

  <div class="flex flex-row gap-4">

    <!-- INVOICE -->
    <div class="flex-1">
      <label for="invoice-search" class="mb-1 block text-sm font-medium">
        Invoice
      </label>

      <div class="flex items-start gap-2">
        <input
          type="text"
          name="invoice"
          id="invoice-search"
          inputmode="numeric"
          autocomplete="off"
          autofocus
          form="transaction-line-form"
          value="{% if selected_customer_detail %}{{ selected_customer_detail.invoice_no }}{% endif %}"
          class="w-full rounded-lg border border-gray-300 px-4 py-2"
          placeholder="Enter invoice number..."
          hx-get="{% url 'transaction_customer_search' order.id %}"
          hx-trigger="keyup changed delay:300ms"
          hx-target="#customer-result"
          hx-swap="innerHTML"
        >

        <div id="customer-result" class="mt-1 min-w-[200px]">
          {% if selected_customer_detail %}
            <div class="font-medium text-green-800">
              Invoice {{ selected_customer_detail.invoice_no }}
            </div>
            <div class="text-green-700">
              {{ selected_customer_detail.customer }}
            </div>
            <input
              type="hidden"
              name="customer_detail"
              form="transaction-line-form"
              value="{{ selected_customer_detail.id }}"
              hx-post="{% url 'set_transaction_context' order.id %}"
              hx-trigger="load"
              hx-swap="none"
              hx-vals='{"customer_detail": "{{ selected_customer_detail.id }}"}'
            >
          {% endif %}
        </div>
      </div>

      {{ form.customer_detail.errors }}
    </div>

    <!-- ORDER TYPE -->
    <div class="flex-1">
      <label for="{{ form.order_type.id_for_label }}" class="mb-1 block text-sm font-medium">
        Order Type
      </label>
      <select
        name="order_type"
        id="{{ form.order_type.id_for_label }}"
        form="transaction-line-form"
        class="w-full rounded-lg border border-gray-300 px-4 py-2"
        hx-post="{% url 'set_transaction_context' order.id %}"
        hx-trigger="change"
        hx-swap="none"
      >
        {% for value, label in form.order_type.field.choices %}
        <option value="{{ value }}" {% if value == form.order_type.value|stringformat:"s" %}selected{% endif %}>
          {{ label }}
        </option>
        {% endfor %}
      </select>
      {{ form.order_type.errors }}
    </div>

    <!-- INVOICE TYPE -->
    <div class="flex-1">
      <label for="{{ form.invoice_type.id_for_label }}" class="mb-1 block text-sm font-medium">
        Invoice Type
      </label>
      <select
        name="invoice_type"
        id="{{ form.invoice_type.id_for_label }}"
        form="transaction-line-form"
        class="w-full rounded-lg border border-gray-300 px-4 py-2"
        hx-post="{% url 'set_transaction_context' order.id %}"
        hx-trigger="change"
        hx-swap="none"
      >
        {% for value, label in form.invoice_type.field.choices %}
        <option value="{{ value }}" {% if value == form.invoice_type.value|stringformat:"s" %}selected{% endif %}>
          {{ label }}
        </option>
        {% endfor %}
      </select>
      {{ form.invoice_type.errors }}
    </div>

  </div>
</div>
