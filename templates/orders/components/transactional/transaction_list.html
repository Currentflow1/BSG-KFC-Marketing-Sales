{% load humanize %}

<div class="rounded-lg border border-gray-200 bg-white p-4 lg:col-span-2 [zoom:0.85]">
  <h2 class="mb-3 font-medium">
    Transaction Lines
  </h2>
  <div class="max-h-93.75 overflow-y-auto overflow-x-hidden rounded-lg border border-gray-200">
    <table class="min-w-full">
      <thead class="sticky top-0 z-10 bg-gray-100">
        <tr>
          <th class="px-4 py-2 text-left">Customer</th>
          <th class="px-4 py-2 text-left">Order Type</th>
          <th class="px-4 py-2 text-left">Product</th>
          <th class="px-4 py-2 text-left">Quantity</th>
          <th class="px-4 py-2 text-left">Line Price</th>
          <th class="px-4 py-2 text-center">Actions</th>
        </tr>
      </thead>

      <tbody>
        {% for line in lines %}
          {% include "orders/components/transactional/partials/transaction_line_row.html" %}
        {% empty %}
          <tr>
            <td colspan="6" class="px-4 py-6 text-center text-gray-500">No transaction lines yet.</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
