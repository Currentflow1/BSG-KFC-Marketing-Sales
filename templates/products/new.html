{% extends "base.html" %}

{% block content %}

<h1 class="text-2xl font-bold mb-6">
  Add Product
</h1>

<form method="post">
  {% csrf_token %}

  {% include "products/components/form.html" %}

  <div class="mt-6">
    <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-white">
      Save Product
    </button>

    <a href="{% url 'product_list' %}" class="ml-2 rounded-lg border px-4 py-2">
      Cancel
    </a>
  </div>
</form>

{% endblock %}
