<div class="flex items-start justify-between">

  <div class="space-y-6">
    <div>
      <h1 class="font-bold text-2xl">
        Records
      </h1>

      <p class="text-gray-400">
        View Order Records
      </p>
    </div>

    <form method="get" class="flex items-center space-x-6">
      <input
        type="text"
        name="search"
        value="{{ request.GET.search }}"
        placeholder="Search Orders..."
        class="w-128 rounded-lg border border-gray-300 px-4 py-2 text-sm
               focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"
      >

      <button
        type="submit"
        class="cursor-pointer rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700"
      >
        Search
      </button>
    </form>
  </div>

  <a
    href="{% url 'short_over_matrix' %}"
    class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 transition-colors"
  >
    Short / Over Report
  </a>

</div>
