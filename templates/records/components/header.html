<div class="flex items-start justify-between">

  <div class="space-y-6">

    <div>
      <h1 class="font-bold text-2xl">
        Records
      </h1>

      <p class="text-gray-400">
        View Order Records
      </p>
    </div>

    <form method="get" id="record-filter-form" class="flex items-center space-x-3">

      <input
        type="text"
        name="search"
        value="{{ request.GET.search }}"
        placeholder="Search Orders..."
        class="w-lg rounded-lg border border-gray-300 px-4 py-2 text-sm
               focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"

        hx-get="{% url 'record_list' %}"
        hx-trigger="keyup changed delay:300ms"
        hx-include="#record-filter-form"
        hx-target="#records-results"
        hx-swap="innerHTML"
        hx-push-url="true"
      >

      <input type="date" name="date_from" value="{{ request.GET.date_from }}"
        class="rounded-lg border border-gray-300 px-3 py-2 text-sm
               focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">

      <span class="text-gray-400">to</span>

      <input type="date" name="date_to" value="{{ request.GET.date_to }}"
        class="rounded-lg border border-gray-300 px-3 py-2 text-sm
               focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">

      <button type="button"
        hx-get="{% url 'record_list' %}"
        hx-include="#record-filter-form"
        hx-target="#records-results"
        hx-swap="innerHTML"
        hx-push-url="true"
        class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium
               text-white transition-colors hover:bg-blue-700">
        Filter
      </button>

    </form>

  </div>

  <div class="flex items-center gap-3">

    <a
      href="{% url 'short_over_matrix' %}"
      class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium
             text-white transition-colors hover:bg-blue-700"
    >
      Short / Over Report
    </a>

    <a
      href="{% url 'mret_percentage_matrix' %}"
      class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium
             text-white transition-colors hover:bg-blue-700"
    >
      MRET % Report
    </a>

  </div>

</div>
