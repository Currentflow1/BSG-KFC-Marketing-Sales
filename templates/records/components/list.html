<div class="overflow-x-auto">
  <table class="min-w-full border border-gray-200 rounded-lg">
    <thead class="sticky top-0 z-10 bg-gray-100">
      <tr>
        <th class="px-4 py-2 text-left">Control No.</th>
        <th class="px-4 py-2 text-left">Agent</th>
        <th class="px-4 py-2 text-left">Area</th>
        <th class="px-4 py-2 text-left">Load Date</th>
        <th class="px-4 py-2 text-left">Return Date</th>
        <th class="px-4 py-2 text-center">Actions</th>
      </tr>
    </thead>

    <tbody>
      {% for order in orders %}
      <tr class="border-t hover:bg-gray-50">

        <td class="px-4 py-2">
          {{ order.control_no }}
        </td>

        <td class="px-4 py-2">
          {{ order.agent }}
        </td>

        <td class="px-4 py-2">
          {{ order.area }}
        </td>

        <td class="px-4 py-2">
          {{ order.mload_date|date:"M j, Y"|default:"—" }}
        </td>

        <td class="px-4 py-2">
          {{ order.mret_date|date:"M j, Y"|default:"—" }}
        </td>

        <td class="px-4 py-2">
          <div class="flex justify-center gap-2">

            <a href="{% url 'report_view' order.id %}"
              class="rounded bg-blue-500 px-3 py-1 text-white hover:bg-blue-600">
              View
            </a>
          </div>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="7" class="px-4 py-6 text-center text-gray-500">
          No orders found.
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
