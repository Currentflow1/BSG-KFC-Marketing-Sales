<div class="mb-4">
  <div class="flex justify-end mb-2 no-print">
    <a
      href="{% url 'record_list' %}"
      class="p-2 rounded font-bold text-white bg-blue-600 hover:bg-blue-700"
    >
      Back to Record
    </a>
    
  </div>

  <div class="border-2 rounded-lg divide-y-2">
    <div class="p-4">
      <h1 class="font-bold text-2xl">
        Report No. {{ order.control_no }}
      </h1>
    </div>

    <div class="grid grid-cols-4 gap-6 p-4">
      <div>
        <p>Area: {{ order.area.area_name }}</p>
        <p>Agent: {{ order.agent.employee_name }}</p>
      </div>

      <div></div>

      <div class="text-right">
        <p>Beginning Date: {{ order.beg_date }}</p>
        <p>End Date: {{ order.end_date }}</p>
      </div>

      <div class="text-right">
        <p>MLOAD Date: {{ order.mload_date }}</p>
        <p>MRET Date: {{ order.mret_date }}</p>
      </div>
    </div>
  </div>

</div>
