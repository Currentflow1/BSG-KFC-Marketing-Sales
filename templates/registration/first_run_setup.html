{% extends "base.html" %}

{% block content %}
<div class="flex min-h-screen items-center justify-center bg-gray-50">

  <div class="w-full max-w-sm space-y-8 rounded-lg border border-gray-200 bg-white p-8">

    <div class="space-y-2 text-center">
      <h1 class="text-2xl font-bold">
        Create Admin Account
      </h1>
      <p class="text-gray-400">
        Welcome! Set up the administrator account to get started.
      </p>
    </div>

    {% if messages %}
      {% for message in messages %}
      <div class="rounded-lg border {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-700{% else %}border-green-200 bg-green-50 text-green-700{% endif %} px-4 py-3 text-sm">
        {{ message }}
      </div>
      {% endfor %}
    {% endif %}

    <form method="post" class="space-y-6">
      {% csrf_token %}

      <div class="space-y-2">
        <label for="id_username" class="block font-medium text-gray-700">
          Username
        </label>
        <input type="text" name="username" id="id_username"
               class="w-full rounded-lg border border-gray-300 px-4 py-2
                      focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"
               required autofocus>
      </div>

      <div class="space-y-2">
        <label for="id_email" class="block font-medium text-gray-700">
          Email <span class="text-gray-400 font-normal">(optional)</span>
        </label>
        <input type="email" name="email" id="id_email"
               class="w-full rounded-lg border border-gray-300 px-4 py-2
                      focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">
      </div>

      <div class="space-y-2">
        <label for="id_password" class="block font-medium text-gray-700">
          Password
        </label>
        <input type="password" name="password" id="id_password"
               class="w-full rounded-lg border border-gray-300 px-4 py-2
                      focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"
               required minlength="8">
      </div>

      <div class="space-y-2">
        <label for="id_confirm" class="block font-medium text-gray-700">
          Confirm Password
        </label>
        <input type="password" name="confirm" id="id_confirm"
               class="w-full rounded-lg border border-gray-300 px-4 py-2
                      focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"
               required minlength="8">
      </div>

      <button type="submit"
              class="w-full rounded-lg bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700">
        Create Account
      </button>

    </form>

  </div>

</div>
{% endblock %}
