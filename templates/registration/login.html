{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-50">
  <form method="post" class="bg-white p-8 rounded-lg shadow-md w-2/3 max-w-sm mt-10">
    {% csrf_token %}

    <h1 class="text-xl font-semibold text-gray-800 mb-6">Log In</h1>

    {% if form.errors %}
      <p class="text-red-600 text-sm mb-4">Your username and password didn't match. Please try again.</p>
    {% endif %}

    <div class="mb-4">
      <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <input type="text" name="username" id="id_username"
             class="block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
             required autofocus>
    </div>

    <div class="mb-6">
      <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input type="password" name="password" id="id_password"
             class="block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
             required>
    </div>

    <button type="submit"
            class="w-full bg-blue-600 text-white font-medium py-2 rounded-md hover:bg-blue-700 transition">
      Log in
    </button>

    <input type="hidden" name="next" value="{{ next }}">
  </form>
</div>
{% endblock %}
